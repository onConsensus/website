# Frontmatter schemas for On Consensus content.
# This file is documentation for editors and CMS configuration —
# it is not consumed at build time. Keep in sync with `_config.yml`
# and any Decap CMS configuration under `/admin/`.

post:
  required:
    title: "Headline of the article."
    author: "Slug of an entry in `_authors/` (filename without `.md`)."
    date: "ISO 8601 publish timestamp (e.g. 2026-05-02 09:00:00 +0000)."
    section: "One of: governance, research, development, cryptography, culture, dispatches."
  optional:
    subtitle: "Standfirst / deck. One sentence, sets up the article."
    series: "Slug of an entry in `_series/`."
    tags: "Array of free-form tag strings."
    excerpt: "Plain-text summary used in cards, feeds, and meta description (~155 chars)."
    featured_image: "Path under `/images/` for the lead photo."
    featured_caption: "Caption + credit for the featured image."
    image: "Override for OG / Twitter card image. Falls back to featured_image."
    reading_time_override: "Integer minutes. Overrides word-count math."
    canonical_url: "External URL if cross-posted; emits rel=canonical."
    license: "Defaults to CC-BY-SA-4.0."
    pgp_signed: "Boolean. If true, layouts may render the matching `/signatures/<slug>.sig` as an ASCII signature block. Sigs live OUTSIDE `_posts/` so Jekyll never treats them as posts."
    featured: "Boolean. The single article with `featured: true` becomes the home-page lead piece."
    block_height: "Integer. Optional Bitcoin block height at publish, surfaced next to the date."
    corrections: "Array of `{date, note}` entries surfaced on `/corrections` and as an inline notice at the top of the article."
    retracted: "Optional `{date, reason}` map. When present, the post renders a full-width retraction overlay; the original text is preserved beneath. Retractions are an editorial decision and require sign-off per `/standards/#corrections`."
    embargo_until: "ISO 8601 timestamp. Until this moment, the build hides the article body and renders only the sealed-commit summary (title + author + source SHA-256 + intent statement). After the deadline, the cron-driven build reveals the full text. See `/verify/#embargoes`."
    embargo_block: "Integer Bitcoin block height. Alternative or additional embargo lift signal. The build compares against the height in `_data/bitcoin.yml` (refreshed at build time)."
    intent_statement: "Plain-prose statement of what the embargoed article will say at a high level. Visible in the sealed commit during the embargo so a reader can independently verify, after lift, that the published text matches the original promise."

author:
  required:
    name: "Display name."
    slug: "URL slug. Must equal the filename without `.md`."
  optional:
    bio: "Short biography (1-3 sentences)."
    avatar: "Path under `/images/`."
    pgp_fingerprint: "Long-form fingerprint, surfaced on the author page."
    joined_date: "ISO date the author joined the publication."
    links:
      mastodon: "Full URL."
      bluesky: "Full URL."
      nostr: "npub… string."
      github: "Full URL."
      website: "Full URL."
    disclosures:
      employer: "Current employer or freelance status."
      holdings: "Array of strings. Material crypto / equity / debt positions; see `/standards/#conflicts` for the materiality threshold."
      grants: "Array of strings. Active and recent (12 months) research / writing grants."
      advisory: "Array of strings. Active advisory roles, paid or unpaid."
      paid_writing: "Array of strings. Outside paid writing in the last 12 months."
      recusals: "Array of strings. Standing recusals — entities the author will not cover."
      last_reviewed: "ISO date of the most recent disclosures review (≤ 6 months old per policy)."

series:
  required:
    title: "Series title."
    slug: "URL slug. Must equal the filename without `.md`."
    description: "1-2 sentence description shown atop the series page."
    editor: "Slug of an editor in `_authors/`."
    status: "open or closed."
  optional:
    cover: "Path under `/images/` for the series cover."
    started: "ISO date the series began."

post_permaid:
  optional:
    permaid_seed: "Stable identifier for the article's permaid binding. Defaults to the post's slug on first publish. To rename a post (slug change) without orphaning citations, set this to the original slug *before* renaming — `_data/permaids.yml` keeps the seed → permaid mapping untouched."

list:
  required:
    title: "Reading-list title."
    slug: "URL slug. Must equal the filename without `.md`."
    description: "1-2 sentence editorial framing shown on the list page and the /lists/ index."
    curator: "Slug of an entry in `_authors/`."
    entries: "Ordered array of `{slug, annotation}` maps. `slug` references a published post; `annotation` is a brief editorial note explaining the entry's place in the path. Embargoed posts are auto-filtered from the rendered list until lift."
  optional:
    last_revised: "ISO date of the most recent edit to the list."
    bundle: "`{pdf, epub}` map of relative URLs to the bundled exports when the export pipeline lands. Empty strings are treated as 'pending' and surface a colophon link instead."
