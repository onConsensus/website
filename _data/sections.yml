  editor: m-vellum
  accent: "#7A5C3F"

- slug: development
  title: Development
  blurb: "Implementation reports, post-mortems, and notes from node operators."
  editor: r-okafor
  accent: "#3F5C7A"

- slug: cryptography
  title: Cryptography
