# =============================================================================
# _data/sections.yml — editorial taxonomy.
#
# Surfaced on every layout that needs to know about sections (masthead nav,
# home columns, section archives, article kickers, JSON-LD `articleSection`,
# section RSS feeds). The single source of truth for the editorial desk.
#
# Fields
# ------
#   slug    — URL slug. Posts set `section: <slug>` in frontmatter.
#   title   — display title.
#   blurb   — single-sentence editorial summary, used on /, /sections/<slug>/,
#             and feed metadata.
#   editor  — slug of the responsible editor in `_authors/`. Surfaces on
#             /ethos and the section landing pages.
#   accent  — 2-px section underline colour. The global accent (#B8412E)
#             remains the only colour with prominence — accents are used as a
#             single hairline under the section name on cards / kickers.
# =============================================================================

- slug: governance
  title: Governance
  blurb: "DAOs, slashing, voting, and the politics of protocols."
  editor: k-arnaud
  accent: "#B8412E"

- slug: research
