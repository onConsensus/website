# Vale configuration — On Consensus house style.
#
# Vale runs on every pull request that touches markdown content
# (.github/workflows/editorial.yml). The rule pack lives at
# `.github/vale/styles/OnConsensus/`.
#
# Severity levels:
#   suggestion  — informational; never blocks merge.
#   warning     — strong nudge; visible in PR review but non-blocking.
#   error       — blocks merge; reserved for hard editorial commitments
#                 (banned phrases, hype words, capitalization of the
#                 publication's core technical vocabulary).
#
# Editorial discipline: an error here means we have committed, in
# writing, that the publication will not ship the offending phrasing.
# Treat the rule list as a contract with the reader.

StylesPath = .github/vale/styles
MinAlertLevel = suggestion

# We do not vendor third-party packages. Every rule under
# `OnConsensus` is hand-authored and reviewable.
Packages =

[*.{md,markdown}]
BasedOnStyles = OnConsensus

# Editorial fixtures that are intentionally not house-voice (e.g.
# direct quotations, archived correspondence, machine-emitted text).
# Authors mark such blocks with `<!-- vale off -->` … `<!-- vale on -->`
# and Vale honours that natively.

# Frontmatter, fenced code blocks, and inline code are excluded by
# default in markdown mode, which is what we want — citations and
# example commands should not be linted as prose.
