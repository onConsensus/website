#-------------------------------
# General Site Settings
title: "On Consensus"
tagline: "On governance, cryptography, and the architectures of trust."
description: "On Consensus is an editorial publication on decentralized & distributed technologies — governance, research, development, cryptography, and culture. No hype, no gradients, just the wire."
url: "https://onconsensus.com"
baseurl: ""
repository: "onConsensus/onconsensus"
email: "editors@onconsensus.com"
lang: en
timezone: UTC

author:
  name: "On Consensus Editors"
  email: "editors@onconsensus.com"


#-------------------------------
# Build Settings
markdown: kramdown
permalink: /feed/:slug
sass:
  sass_dir: _sass
  style: compressed

# GitHub-Pages-allowed plugins only.
# https://pages.github.com/versions/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-paginate

paginate: 12
# jekyll-paginate (v1, GitHub-Pages-allowed) requires the source page to live
# in the same parent directory as `paginate_path`. With source at
# `feed/index.html`, page 1 is `/feed/` and pages 2+ live at `/feed/page2/`,
# `/feed/page3/`, … This is the conventional v1 pattern.
paginate_path: "/feed/page:num"

# Files & paths included in the build output that Jekyll would otherwise skip
# (everything starting with `.` is excluded by default).
include:
  - .well-known

# Files & paths excluded from the build output
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - LICENSE-CODE
  - LICENSE-CONTENT
  - CODE_OF_CONDUCT.md
  - node_modules
  - vendor
  - .replit
  - replit.nix
  - replit.md
  - .agents
  - .local
  - .cache
  - attached_assets
  - .DS_Store


#-------------------------------
# Collections
collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /feed/:slug
  authors:
    output: true
    permalink: /:name
  series:
    output: true
    permalink: /series/:name


#-------------------------------
# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      license: "CC-BY-SA-4.0"
      pgp_signed: false
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "series"
    values:
      layout: "series"


#-------------------------------
# Sections (the editorial taxonomy)
#
# The full sections list lives in `_data/sections.yml` (slug, title,
# blurb, editor, accent). Layouts and feeds read it as
# `site.data.sections`. Editorial posts set `section: <slug>` in
# frontmatter; valid slugs are: governance, research, development,
# cryptography, culture, dispatches.


#-------------------------------
# Social (decentralized stack only — no X/Twitter)
# Editorial decision: the audience reads the open social web.
social:
  mastodon: "https://mastodon.social/@onconsensus"
  bluesky: "https://bsky.app/profile/onconsensus.com"
  nostr: "npub1onconsensus000000000000000000000000000000000000000000000000"
  github: "https://github.com/onConsensus"
  farcaster: "https://warpcast.com/onconsensus"
  rss: "/feed.xml"


#-------------------------------
# Editorial defaults
license:
  content: "CC-BY-SA-4.0"
  code: "MIT"

#-------------------------------
# Crypto-native content primitives — see /verify/ for the editorial rationale.
#
# `onchain.explorers` configures the link clusters that `/js/onchain.js`
# rewrites tx hashes / addresses / ENS names / block heights into. Order
# matters: the first explorer in each list is the visible default; the
# rest open in a popover so the reader can cross-check provenance.
#
# Adding a new explorer is a config-only change — no code edits required.
onchain:
  explorers:
    eth_tx:
      - { name: "Etherscan",   url: "https://etherscan.io/tx/{value}" }
      - { name: "Blockscout",  url: "https://eth.blockscout.com/tx/{value}" }
      - { name: "Otterscan",   url: "https://otterscan.io/tx/{value}" }
    eth_address:
      - { name: "Etherscan",   url: "https://etherscan.io/address/{value}" }
      - { name: "Blockscout",  url: "https://eth.blockscout.com/address/{value}" }
      - { name: "Otterscan",   url: "https://otterscan.io/address/{value}" }
    ens:
      - { name: "ENS app",     url: "https://app.ens.domains/{value}" }
      - { name: "Etherscan",   url: "https://etherscan.io/name-lookup-search?id={value}" }
    btc_block:
      - { name: "mempool.space",  url: "https://mempool.space/block/{value}" }
      - { name: "Blockstream",    url: "https://blockstream.info/block-height/{value}" }

# Editorial safety: by default the on-chain rewriter only auto-links block
# heights inside elements with `data-onchain-block` (e.g. the byline) to
# avoid false positives on bare digit strings in body copy. Authors can
# opt a body span in with the same attribute.
onchain_block_heights_in_body: false

#-------------------------------
# jekyll-feed (Atom output)
# Editorial decision: jekyll-feed produces an Atom feed at /feed.xml. The
# hand-rolled /atom.xml and /feed.json sit alongside it for completeness.
feed:
  posts_limit: 30
