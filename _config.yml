#-------------------------------
# General Site Settings
title: "On Consensus"
tagline: "On governance, cryptography, and the architectures of trust."
description: "On Consensus is an editorial publication on decentralized & distributed technologies — governance, research, development, cryptography, and culture. No hype, no gradients, just the wire."
url: "https://onconsensus.com"
baseurl: ""
email: "editors@onconsensus.com"
lang: en
timezone: UTC

author:
  name: "On Consensus Editors"
  email: "editors@onconsensus.com"


#-------------------------------
# Build Settings
markdown: kramdown
permalink: /feed/:slug
sass:
  sass_dir: _sass
  style: compressed

# GitHub-Pages-allowed plugins only.
# https://pages.github.com/versions/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-paginate

paginate: 12
# jekyll-paginate (v1, GitHub-Pages-allowed) requires the source page to live
# in the same parent directory as `paginate_path`. With source at
# `feed/index.html`, page 1 is `/feed/` and pages 2+ live at `/feed/page2/`,
# `/feed/page3/`, … This is the conventional v1 pattern.
paginate_path: "/feed/page:num"

# Files & paths excluded from the build output
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - .replit
  - replit.nix
  - replit.md
  - .agents
  - .local
  - .cache
  - attached_assets
  - .DS_Store


#-------------------------------
# Collections
collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /feed/:slug
  authors:
    output: true
    permalink: /:name
  series:
    output: true
    permalink: /series/:name


#-------------------------------
# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      license: "CC-BY-SA-4.0"
      pgp_signed: false
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "series"
    values:
      layout: "series"


#-------------------------------
# Sections (the editorial taxonomy)
# A post's `section:` frontmatter must be one of these slugs.
# `accent` is consumed only as a 2px underline under section names —
# the global accent (#B8412E) remains the only colour with prominence.
sections:
  - slug: governance
    title: "Governance"
    blurb: "DAOs, slashing, voting, and the politics of protocols."
    accent: "#B8412E"
  - slug: research
    title: "Research"
    blurb: "Original analysis and notes from the academic edge."
    accent: "#7A5C3F"
  - slug: development
    title: "Development"
    blurb: "Implementation reports, post-mortems, and notes from node operators."
    accent: "#3F5C7A"
  - slug: cryptography
    title: "Cryptography"
    blurb: "Primitives, proofs, and the math underneath the chains."
    accent: "#3F7A5C"
  - slug: culture
    title: "Culture"
    blurb: "The people, the prose, and the politics of decentralization."
    accent: "#7A3F5C"
  - slug: dispatches
    title: "Dispatches"
    blurb: "Short-form link-blog. On the wire."
    accent: "#5C5C5C"


#-------------------------------
# Social (decentralized stack only — no X/Twitter)
# Editorial decision: the audience reads the open social web.
social:
  mastodon: "https://mastodon.social/@onconsensus"
  bluesky: "https://bsky.app/profile/onconsensus.com"
  nostr: "npub1onconsensus000000000000000000000000000000000000000000000000"
  github: "https://github.com/onConsensus"
  farcaster: "https://warpcast.com/onconsensus"
  rss: "/feed.xml"


#-------------------------------
# Editorial defaults
license:
  content: "CC-BY-SA-4.0"
  code: "MIT"

#-------------------------------
# jekyll-feed (Atom output)
# Editorial decision: jekyll-feed produces an Atom feed at /feed.xml. The
# hand-rolled /atom.xml and /feed.json sit alongside it for completeness.
feed:
  posts_limit: 30
