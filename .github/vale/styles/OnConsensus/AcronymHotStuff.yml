# Per-acronym first-use-expansion check (sibling of Acronyms.yml).
# See Acronyms.yml for the editorial rationale on why each acronym
# gets its own file rather than a unioned rule.
extends: conditional
message: "Acronym 'HotStuff' is used without a parenthesised expansion in this file. Expand on first use, e.g. 'HotStuff consensus (HotStuff)'."
level: warning
scope: text
ignorecase: false
first:  '\bHotStuff\b'
second: '\bHotStuff\b\s*\([^)]+\)|\([^)]+\)\s*\bHotStuff\b'
