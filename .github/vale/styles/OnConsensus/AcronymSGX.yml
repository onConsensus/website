# Per-acronym first-use-expansion check (sibling of Acronyms.yml).
# See Acronyms.yml for the editorial rationale on why each acronym
# gets its own file rather than a unioned rule.
extends: conditional
message: "Acronym 'SGX' is used without a parenthesised expansion in this file. Expand on first use, e.g. 'Software Guard Extensions (SGX)'."
level: warning
scope: text
ignorecase: false
first:  '\bSGX\b'
second: '\bSGX\b\s*\([^)]+\)|\([^)]+\)\s*\bSGX\b'
