# Per-acronym first-use-expansion check (sibling of Acronyms.yml).
# See Acronyms.yml for the editorial rationale on why each acronym
# gets its own file rather than a unioned rule.
extends: conditional
message: "Acronym 'MPC' is used without a parenthesised expansion in this file. Expand on first use, e.g. 'Multi-Party Computation (MPC)'."
level: warning
scope: text
ignorecase: false
first:  '\bMPC\b'
second: '\bMPC\b\s*\([^)]+\)|\([^)]+\)\s*\bMPC\b'
