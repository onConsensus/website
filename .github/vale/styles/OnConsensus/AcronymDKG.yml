# Per-acronym first-use-expansion check (sibling of Acronyms.yml).
# See Acronyms.yml for the editorial rationale on why each acronym
# gets its own file rather than a unioned rule.
extends: conditional
message: "Acronym 'DKG' is used without a parenthesised expansion in this file. Expand on first use, e.g. 'Distributed Key Generation (DKG)'."
level: warning
scope: text
ignorecase: false
first:  '\bDKG\b'
second: '\bDKG\b\s*\([^)]+\)|\([^)]+\)\s*\bDKG\b'
