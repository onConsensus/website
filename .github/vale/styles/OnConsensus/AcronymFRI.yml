# Per-acronym first-use-expansion check (sibling of Acronyms.yml).
# See Acronyms.yml for the editorial rationale on why each acronym
# gets its own file rather than a unioned rule.
extends: conditional
message: "Acronym 'FRI' is used without a parenthesised expansion in this file. Expand on first use, e.g. 'Fast Reed-Solomon Interactive Oracle Proof (FRI)'."
level: warning
scope: text
ignorecase: false
first:  '\bFRI\b'
second: '\bFRI\b\s*\([^)]+\)|\([^)]+\)\s*\bFRI\b'
