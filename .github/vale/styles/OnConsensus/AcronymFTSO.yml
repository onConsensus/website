# Per-acronym first-use-expansion check (sibling of Acronyms.yml).
# See Acronyms.yml for the editorial rationale on why each acronym
# gets its own file rather than a unioned rule.
extends: conditional
message: "Acronym 'FTSO' is used without a parenthesised expansion in this file. Expand on first use, e.g. 'Flare Time Series Oracle (FTSO)'."
level: warning
scope: text
ignorecase: false
first:  '\bFTSO\b'
second: '\bFTSO\b\s*\([^)]+\)|\([^)]+\)\s*\bFTSO\b'
