# Per-acronym first-use-expansion check.
#
# Vale's `conditional` extension fires when `first` matches but
# `second` does not occur in the same scope. We use one rule file
# per acronym (this file plus its `Acronym*.yml` siblings) because
# unioning multiple acronyms into a single `conditional` rule
# creates a satisfaction loophole: expanding *any one* acronym
# in the file would satisfy `second` for the union and silence
# warnings for every other unexpanded acronym in the same doc.
#
# Each per-acronym file binds `first` and `second` to the same
# token, so 'MEV' must be expanded *as MEV*, 'KZG' must be expanded
# *as KZG*, and so on.
#
# Pattern: the rule passes if the acronym appears next to a
# parenthesised expansion in either order:
#     "Maximal Extractable Value (MEV)"
#     "MEV (Maximal Extractable Value)"
extends: conditional
message: "Acronym 'MEV' is used without a parenthesised expansion in this file. Expand on first use, e.g. 'Maximal Extractable Value (MEV)'."
level: warning
scope: text
ignorecase: false
first:  '\bMEV\b'
second: '\bMEV\b\s*\([^)]+\)|\([^)]+\)\s*\bMEV\b'
