# Per-acronym first-use-expansion check (sibling of Acronyms.yml).
# See Acronyms.yml for the editorial rationale on why each acronym
# gets its own file rather than a unioned rule.
extends: conditional
message: "Acronym 'ERC' is used without a parenthesised expansion in this file. Expand on first use, e.g. 'Ethereum Request for Comment (ERC)'."
level: warning
scope: text
ignorecase: false
first:  '\bERC\b'
second: '\bERC\b\s*\([^)]+\)|\([^)]+\)\s*\bERC\b'
