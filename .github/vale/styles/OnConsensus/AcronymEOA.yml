# Per-acronym first-use-expansion check (sibling of Acronyms.yml).
# See Acronyms.yml for the editorial rationale on why each acronym
# gets its own file rather than a unioned rule.
extends: conditional
message: "Acronym 'EOA' is used without a parenthesised expansion in this file. Expand on first use, e.g. 'Externally Owned Account (EOA)'."
level: warning
scope: text
ignorecase: false
first:  '\bEOA\b'
second: '\bEOA\b\s*\([^)]+\)|\([^)]+\)\s*\bEOA\b'
