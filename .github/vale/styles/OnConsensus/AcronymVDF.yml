# Per-acronym first-use-expansion check (sibling of Acronyms.yml).
# See Acronyms.yml for the editorial rationale on why each acronym
# gets its own file rather than a unioned rule.
extends: conditional
message: "Acronym 'VDF' is used without a parenthesised expansion in this file. Expand on first use, e.g. 'Verifiable Delay Function (VDF)'."
level: warning
scope: text
ignorecase: false
first:  '\bVDF\b'
second: '\bVDF\b\s*\([^)]+\)|\([^)]+\)\s*\bVDF\b'
