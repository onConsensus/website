# Per-acronym first-use-expansion check (sibling of Acronyms.yml).
# See Acronyms.yml for the editorial rationale on why each acronym
# gets its own file rather than a unioned rule.
extends: conditional
message: "Acronym 'DA' is used without a parenthesised expansion in this file. Expand on first use, e.g. 'Data Availability (DA)'."
level: warning
scope: text
ignorecase: false
first:  '\bDA\b'
second: '\bDA\b\s*\([^)]+\)|\([^)]+\)\s*\bDA\b'
