name: pr-preview

# Per-PR preview deployment + visual diff against `main`.
#
# Pipeline
#   1. `build` — checkout the PR HEAD, run the full content pipeline
#      (changelog, timestamps, methodology, embargoes, permaids,
#      feeds), and `jekyll build`. Upload `_site/` as an artifact.
#   2. `deploy` — push the built site to Cloudflare Pages, which
#      issues a unique preview URL of the form
#      `<commit>.<project>.pages.dev`. The URL is captured as a job
#      output for the visual-diff step.
#   3. `visual-diff` — Playwright takes screenshots of a curated set
#      of pages on the preview build, compares them against baseline
#      screenshots stored on the `screenshot-baselines` branch, then
#      pushes the resulting screenshot + diff PNGs to a
#      `pr-screenshots` branch under `pr/<n>/<sha>/`. The PR comment
#      then embeds the public raw.githubusercontent.com URLs inline
#      so reviewers see the diff images without leaving the PR.
#
# Required repository secrets
#   CLOUDFLARE_API_TOKEN     — token with Pages:Edit scope.
#   CLOUDFLARE_ACCOUNT_ID    — Cloudflare account UUID.
#
# If those secrets are not configured (e.g. a fork), the `deploy` and
# `visual-diff` jobs skip cleanly and the workflow reports success on
# the build alone — opens the door for adopters to enable when ready.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write       # push diff PNGs to `pr-screenshots`
  pull-requests: write
  deployments: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT: onconsensus

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
      BUNDLE_PATH: vendor/bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Generate content data
        run: |
          ruby scripts/build_changelog.rb
          ruby scripts/build_timestamps.rb
          ruby scripts/build_methodology.rb
          ruby scripts/build_embargoes.rb
          ruby scripts/build_permaids.rb
          ruby scripts/build_feeds.rb

      - name: Jekyll build
        run: bundle exec jekyll build --trace

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

  deploy:
    name: Deploy preview to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    # Fork PRs cannot access secrets — skip cleanly. The build job
    # above still validates the change.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      preview_url: ${{ steps.cf.outputs.url }}
      deployed:   ${{ steps.cf.outputs.deployed }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Publish to Cloudflare Pages
        id: cf
        env:
          CF_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "[deploy] Cloudflare credentials not configured; skipping preview deploy."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install -g wrangler@3
          out=$(CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT" \
            wrangler pages deploy _site \
              --project-name "$CLOUDFLARE_PAGES_PROJECT" \
              --branch "pr-${{ github.event.pull_request.number }}" \
              --commit-hash "${{ github.event.pull_request.head.sha }}")
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+\.pages\.dev' | head -1)
          echo "[deploy] preview URL: $url"
          echo "url=$url"      >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: steps.cf.outputs.deployed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.cf.outputs.url }}";
            const body = [
              "**Preview deploy**: " + url,
              "",
              "Visual-diff screenshots will be posted in a follow-up comment once the comparator finishes.",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  visual-diff:
    name: Visual diff against main
    needs: deploy
    runs-on: ubuntu-latest
    if: needs.deploy.outputs.deployed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save \
            @playwright/test@^1.47 \
            pixelmatch@^5.3 \
            pngjs@^7.0
          npx playwright install --with-deps chromium

      - name: Fetch baseline screenshots
        id: baselines
        # Baselines live on a long-lived `screenshot-baselines` branch
        # refreshed by a `main`-branch workflow. Treat absence as a
        # first-run case and produce baselines from the preview URL
        # instead of failing.
        run: |
          mkdir -p baselines
          if git fetch origin screenshot-baselines:screenshot-baselines 2>/dev/null; then
            git --work-tree=baselines checkout screenshot-baselines -- screenshots 2>/dev/null || true
            mv baselines/screenshots/* baselines/ 2>/dev/null || true
            rmdir baselines/screenshots 2>/dev/null || true
            echo "baselines_exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "[visual-diff] no baselines branch; this run will publish a new baseline"
            echo "baselines_exist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish screenshots & diffs to pr-screenshots branch
        id: publish
        # We push images to a separate orphan branch BEFORE generating
        # the report, so the report can embed raw URLs that already
        # resolve. The branch is force-rewritten on each PR push but
        # different PRs share it (subdirectories are namespaced by PR
        # number + commit SHA), so concurrent PRs do not collide
        # because we always rebase atop `pr-screenshots`'s tip.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA:    ${{ github.event.pull_request.head.sha }}
        run: |
          # Run the comparator once with no IMAGE_BASE_URL to *produce*
          # the images, then publish, then re-run to generate the
          # report with inline embeds. The first invocation skips the
          # image-bearing report section; only the second one is sent
          # to the PR comment.
          PREVIEW_URL="${{ needs.deploy.outputs.preview_url }}" \
          BASELINES_EXIST="${{ steps.baselines.outputs.baselines_exist }}" \
          node scripts/visual_diff.js || echo "[visual-diff] comparator emitted infra warnings; continuing to publish"

          # Push the artifacts.
          repo="${{ github.repository }}"
          subdir="pr/${PR_NUMBER}/${PR_SHA}"
          tmp=$(mktemp -d)
          git clone --branch pr-screenshots --single-branch \
              "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$tmp" 2>/dev/null || {
            git -C "$tmp" init -b pr-screenshots
            git -C "$tmp" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git"
          }
          mkdir -p "$tmp/$subdir/screenshots" "$tmp/$subdir/diffs"
          cp -f screenshots/*.png "$tmp/$subdir/screenshots/" 2>/dev/null || true
          cp -f diffs/*.png       "$tmp/$subdir/diffs/"       2>/dev/null || true
          git -C "$tmp" config user.email "actions@github.com"
          git -C "$tmp" config user.name  "github-actions"
          git -C "$tmp" add "$subdir"
          git -C "$tmp" commit -m "PR #${PR_NUMBER} screenshots @ ${PR_SHA}" >/dev/null || \
            { echo "[visual-diff] no image changes to publish"; }
          # Push with a short retry loop to tolerate concurrent PRs.
          for i in 1 2 3; do
            if git -C "$tmp" push origin pr-screenshots; then
              break
            fi
            git -C "$tmp" pull --rebase origin pr-screenshots
          done
          base="https://raw.githubusercontent.com/${repo}/pr-screenshots/${subdir}"
          echo "[visual-diff] publish base: $base"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Re-run comparator to produce report with inline embeds
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
          BASELINES_EXIST: ${{ steps.baselines.outputs.baselines_exist }}
          IMAGE_BASE_URL:  ${{ steps.publish.outputs.base }}
        run: node scripts/visual_diff.js

      - name: Upload diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            screenshots/
            diffs/
            visual-diff-report.md
          retention-days: 14

      - name: Post diff summary on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('visual-diff-report.md')) {
              core.info('no visual-diff-report.md to post');
              return;
            }
            const body = fs.readFileSync('visual-diff-report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body
            });
