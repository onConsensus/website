name: build-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Daily cron here is a *build-health* sanity check only — it confirms
  # the site still compiles cleanly and that the timestamp / methodology /
  # embargo data generators succeed. It does NOT publish the site.
  # The deterministic public reveal is driven by the hourly cron in
  # `deploy.yml`, which actually republishes Pages once an embargo
  # deadline has passed.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Jekyll build + htmlproofer
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
      BUNDLE_PATH: vendor/bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so scripts/build_changelog.rb can derive
          # post-publish edits from `git log` of `_posts/`.
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install htmlproofer
        run: gem install html-proofer --version "~> 5.0"

      - name: Generate article changelog from git
        run: ruby scripts/build_changelog.rb

      - name: Install OpenTimestamps client
        run: |
          # Hard requirement: a build-check that cannot stamp is a
          # broken trust signal. We *do* tolerate the calendar
          # servers being temporarily unreachable (network, rate
          # limits) — that is handled inside scripts/build_timestamps.rb
          # which records `status: pending` in `_data/timestamps.yml`
          # and lets the post footer say so. But the client itself
          # must install cleanly.
          python3 -m pip install --quiet --user opentimestamps-client
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Refresh Bitcoin tip (best-effort, used for block-based embargoes)
        run: |
          set +e
          tip=$(curl -fsSL --max-time 6 https://mempool.space/api/blocks/tip/height || true)
          hash=$(curl -fsSL --max-time 6 https://mempool.space/api/blocks/tip/hash || true)
          if [ -n "$tip" ] && [ -n "$hash" ]; then
            cat > _data/bitcoin.yml <<EOF
          tip_height: $tip
          tip_hash: "$hash"
          tip_at: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          source: "mempool.space (refreshed at build time)"
          EOF
            echo "[ci] Bitcoin tip refreshed: block $tip"
          else
            echo "[ci] Bitcoin tip refresh failed; keeping committed _data/bitcoin.yml"
          fi

      - name: Generate timestamp / methodology / embargo data
        run: |
          ruby scripts/build_timestamps.rb
          ruby scripts/build_methodology.rb
          ruby scripts/build_embargoes.rb

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace

      - name: Run htmlproofer on _site/
        run: |
          htmlproofer ./_site \
            --disable-external \
            --check-html \
            --check-img-http \
            --check-opengraph \
            --enforce-https \
            --ignore-empty-alt \
            --ignore-missing-alt \
            --ignore-urls "/^https:\/\/onconsensus\.com/,/example\.(com|org)/,/^npub1/" \
            --ignore-files "/_site\/admin\//"
