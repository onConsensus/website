name: broadsheet-vrt

# Broadsheet visual-regression test.
#
# Why this exists
#   The monthly broadsheet PDF (Task #13) is rendered headless via
#   Playwright from `_layouts/broadsheet.html` + `assets/css/
#   broadsheet.scss`. The CSS is intricate — A3 `@page`, four-column
#   body, `::first-letter` drop caps, `break-inside: avoid`, `column-
#   span: all` for h2s and footnotes. A trivial CSS edit elsewhere
#   (e.g. a global `*` rule in `_sass/_base.scss`) could silently
#   break print layout, and nobody would notice until the cron job
#   runs on the 1st of the month and ships a broken PDF.
#
#   This job rasterises the most recent month's broadsheet to one
#   PNG per A3 page on every PR that touches the broadsheet template,
#   its stylesheet, the shared `_sass/` partials, or the rendering
#   script, then diffs against committed baselines under
#   `tests/broadsheet/baselines/`. A single page drifting past the
#   threshold (default 0.2 %) fails the job.
#
# How to refresh baselines
#   When you intentionally change the broadsheet design, run this
#   workflow manually with `refresh_baselines: true` (the
#   "accept-broadsheet-baseline" mode). It re-renders the target
#   month, copies the per-page PNGs into `tests/broadsheet/baselines/`,
#   and commits them straight to the PR's head branch (or `main`,
#   if dispatched there).

on:
  pull_request:
    paths:
      - "_layouts/broadsheet.html"
      - "assets/css/broadsheet.scss"
      - "_sass/**"
      - "scripts/render_print.js"
      - "scripts/diff_broadsheet.js"
      - "tests/broadsheet/**"
      - ".github/workflows/broadsheet-vrt.yml"
  # Manual dispatch doubles as the "accept-broadsheet-baseline"
  # operator action: set `refresh_baselines: true` to re-render the
  # target month and commit the resulting PNGs into
  # `tests/broadsheet/baselines/` on the dispatched ref. This is the
  # documented escape hatch when an intentional design change has
  # made the previous baselines stale.
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM (defaults to the most recent month under _site/print/)"
        required: false
      refresh_baselines:
        description: "accept-broadsheet-baseline: re-render and commit baselines instead of diffing"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: broadsheet-vrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vrt:
    name: Diff broadsheet pages vs baselines
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@v4
        with:
          # Default checkout: PR runs land on the merge commit (fine
          # for diffing); workflow_dispatch lands on the dispatched
          # ref, which is what `refresh_baselines` needs to push back.
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install poppler-utils (provides pdftoppm)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Playwright + diff deps
        run: |
          npm init -y >/dev/null
          npm install --no-save \
            playwright@^1.47 \
            pixelmatch@^5.3 \
            pngjs@^7.0
          npx playwright install --with-deps chromium

      - name: Refresh stubs and build site
        run: |
          ruby scripts/build_podcast.rb
          ruby scripts/build_print.rb
          bundle exec jekyll build

      - name: Determine target month
        id: m
        run: |
          M="${{ github.event.inputs.month }}"
          if [ -z "$M" ]; then
            # Most recent YYYY-MM directory under _site/print/.
            M=$(ls -1 _site/print 2>/dev/null \
                  | grep -E '^[0-9]{4}-[0-9]{2}$' \
                  | sort | tail -n1)
          fi
          if [ -z "$M" ]; then
            echo "::error::no print months found under _site/print/"
            exit 1
          fi
          echo "ym=$M" >> "$GITHUB_OUTPUT"
          echo "[broadsheet-vrt] target month: $M"

      - name: Render broadsheet PDF + per-page PNGs
        run: node scripts/render_print.js --png "${{ steps.m.outputs.ym }}"

      - name: Diff against baselines
        if: ${{ github.event.inputs.refresh_baselines != 'true' }}
        run: |
          node scripts/diff_broadsheet.js \
            --current=_site/print \
            --baseline=tests/broadsheet/baselines \
            --diff-out=tests/broadsheet/diffs \
            --month="${{ steps.m.outputs.ym }}"

      - name: Upload current pages and diffs on failure
        if: ${{ failure() && github.event.inputs.refresh_baselines != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: broadsheet-vrt-${{ steps.m.outputs.ym }}
          path: |
            _site/print/${{ steps.m.outputs.ym }}-page-*.png
            _site/print/${{ steps.m.outputs.ym }}.pdf
            tests/broadsheet/diffs/*.png
          retention-days: 14

      - name: Refresh and commit baselines
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.refresh_baselines == 'true' }}
        run: |
          set -euo pipefail
          YM="${{ steps.m.outputs.ym }}"
          mkdir -p tests/broadsheet/baselines
          # Drop any previous baselines for this month so dropped
          # pages don't linger as ghost baselines.
          rm -f tests/broadsheet/baselines/${YM}-page-*.png
          cp _site/print/${YM}-page-*.png tests/broadsheet/baselines/
          git config user.name  "on-consensus-press-bot"
          git config user.email "press@onconsensus.com"
          git add tests/broadsheet/baselines
          if git diff --cached --quiet; then
            echo "[broadsheet-vrt] baselines already up to date"
            exit 0
          fi
          git commit -m "broadsheet-vrt: refresh ${YM} baselines"
          git push
